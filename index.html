async function loadNews(force=false){if(newsView==='saved'||!newsURL(newsConfig.url)||!newsConfig.token)return;const rules=activeRules();if(!rules.length){newsItems=[];if(tab==='news')render();return}let key=feedKey();if(!force&&(newsLoading||key===newsLoadedKey&&Date.now()-newsFetched<600000))return;let seq=++newsSerial;newsAIKey++;newsAIBusy=false;newsAIError='';newsLoading=true;newsError='';if(key!==newsLoadedKey)newsItems=[];if(tab==='news')render();let rows=[],fail=0,unauth=0,partial=false,diagnostics=[],received=0;const archiveKey='my-life-direct-news-cache-v1';let archive={};try{archive=JSON.parse(localStorage.getItem(archiveKey)||'{}')||{}}catch{}try{for(let i=0;i<rules.length;i+=4){if(seq!==newsSerial)return;let batch=rules.slice(i,i+4);let res=await Promise.allSettled(batch.map(r=>newsFetch(r,force)));res.forEach((v,j)=>{if(v.status==='rejected'){fail++;if(v.reason?.status===401)unauth++;diagnostics.push((batch[j]?.group||bi('Главное','Top stories'))+': '+newsDiagnostic(v.reason));const old=archive[batch[j]?.q];if(Array.isArray(old))rows.push(...old.filter(x=>x&&articleURL(x.link)));return}let r=batch[j];partial||=!!v.value.partial;if(v.value.partial&&Array.isArray(v.value.details))diagnostics.push(r.group+': '+v.value.details.join(' · '));received+=v.value.items.length;const fresh=v.value.items.filter(x=>x&&typeof x.title==='string'&&articleURL(x.link)&&Number.isFinite(Date.parse(x.date))&&filterNews(x,r)).slice(0,30).map(x=>({title:x.title,source:x.source||'',sourceDomain:x.sourceDomain||'',link:x.link,date:x.date,description:cleanNewsText(x.description,1200),image:newsImage(x.image),topic:r?.q||'',group:r?.group||'',priority:r?.priority||'normal',notify:!!r?.notify,translate:!!r?.translate,lang:sourceLang(r)}));const prev=Array.isArray(archive[r.q])?archive[r.q]:[];const merged=dedupeNews([...fresh,...(v.value.partial?prev.filter(x=>x&&articleURL(x.link)):[])]).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,35);archive[r.q]=merged;rows.push(...merged)});if(unauth===batch.length&&fail===batch.length)break;}if(seq!==newsSerial)return;rows=rows.filter(x=>x.topic!=='sport'||!/\brugby\b|six nations|\bcricket\b|\bNCAA\b|college football|college basketball|fantasy (football|basketball|baseball)|power rankings|mock draft|betting odds|best bets/i.test(x.title+' '+(x.description||'')));rows.sort((a,b)=>(a.priority==='high'?0:1)-(b.priority==='high'?0:1)||b.date.localeCompare(a.date));try{localStorage.setItem(archiveKey,JSON.stringify(archive))}catch{}if(rows.length||fail<rules.length){newsItems=dedupeNews(rows).slice(0,120);newsLoadedKey=key;newsFetched=Date.now()}if(fail||partial)newsError=(unauth?bi('Проверьте ключ NEWS_TOKEN.','Check NEWS_TOKEN.'):bi('Часть источников недоступна.','Some sources are unavailable.'))+(diagnostics.length?' '+diagnostics.slice(0,4).join(' | '):'');else if(!rows.length)newsError=received?bi('Получено материалов: ','Articles received: ')+received+bi('. Ни один не прошёл фильтры.','. None passed filters.'):bi('Сервер ответил успешно, но вернул 0 новостей.','Server responded successfully, but returned 0 articles.');}finally{if(seq===newsSerial){newsLoading=false;if(tab==='news')render();}}}
function aiFor(x){return newsAI.get(x.link)||x.ai||null}
async function translateNews(manual=true,link=''){if(newsAIBusy||!newsConfig.token||!newsURL(newsConfig.url))return;let rows=(newsView==='saved'?newsRecords().newsSaved:newsItems).filter(x=>!aiFor(x)&&(link?x.link===link:manual||x.translate&&x.lang!=='ru')).slice(0,manual?8:8);if(!rows.length)return;let seq=++newsAIKey;newsAIBusy=true;newsAIError='';render();try{let r=await fetch(new URL('/news/translate',newsConfig.url),{method:'POST',headers:{Authorization:'Bearer '+newsConfig.token,'Content-Type':'application/json'},body:JSON.stringify({items:rows.map(x=>({title:cleanNewsText(x.title,350),description:cleanNewsText(x.description,1000)}))}),credentials:'omit',referrerPolicy:'no-referrer'});if(!r.ok)throw Error(String(r.status));let data=await r.json();if(!Array.isArray(data.items)||data.items.length!==rows.length)throw Error('response');if(seq!==newsAIKey)return;data.items.forEach((a,i)=>{if(a&&typeof a.title==='string'&&a.title.trim()){let value={title:cleanNewsText(a.title,400),summary:cleanNewsText(a.summary,600)};newsAI.set(rows[i].link,value);let saved=newsRecords().newsSaved.find(x=>x.link===rows[i].link);if(saved)saved.ai=value;}});while(newsAI.size>300)newsAI.delete(newsAI.keys().next().value);persist();}catch(e){if(seq===newsAIKey)newsAIError=e.message==='503'?bi('Подключите Workers AI (binding AI) на Cloudflare.','Connect Workers AI (binding AI) on Cloudflare.'):bi('Перевод недоступен. Возможен лимит AI или ошибка подключения.','Translation unavailable. Check AI quota or connection.');}finally{if(seq===newsAIKey){newsAIBusy=false;if(tab==='news')render()}}}

function parseTeamEvents(j,f){return (j.events||[]).map(e=>{let c=e.competitions?.[0],stamp=e.date||c?.date,competitors=c?.competitors||[],status=c?.status?.type||e.status?.type||{},completed=status.completed===true||status.state==='post'&&status.name==='STATUS_FINAL';let teams=competitors.map(t=>{const a=t.team||{},id=String(a.id||t.id||''),abbr=String(a.abbreviation||''),name=a.displayName||a.name||a.shortDisplayName||'';let logo=logoURL(a.logo||a.logos?.[0]?.href||'');if(!logo&&id&&f.league.startsWith('soccer/')&&/^\d+$/.test(id))logo='https://a.espncdn.com/i/teamlogos/soccer/500/'+id+'.png';if(!logo&&/^[a-z0-9]{2,5}$/i.test(abbr)){const sport=f.league==='basketball/nba'?'nba':f.league==='hockey/nhl'?'nhl':'';if(sport)logo='https://a.espncdn.com/i/teamlogos/'+sport+'/500/'+abbr.toLowerCase()+'.png'}return {id,name,abbr,logo,favorite:id===f.id}}).filter(t=>t.name);let title=e.name||e.shortName||teams.map(t=>t.name).join(' — ');if(!stamp||isNaN(new Date(stamp))||!title)return null;let result=completed?competitors.map(t=>`${t.team?.shortDisplayName||t.team?.displayName||''} ${typeof t.score==='object'?t.score.displayValue||t.score.value||'':t.score??''}`).join(' · '):'';return {id:f.league+':'+String(e.id||stamp+title),source:f.league+':'+f.id,league:f.league,title,stamp,result,completed,eventId:String(e.id||''),teams}}).filter(Boolean)}
async function refreshSports(){if(sportBusy)return;const token=++sportToken;const favorites=life().favorites.slice(),racing=life().racing;sportBusy=true;sportStatus='';render();let errors=0,ok=0;const jobs=favorites.map(f=>async()=>{const source=f.league+':'+f.id;let events=[];if(f.league==='soccer/all'){const base=espn+'soccer/',path='/teams/'+f.id+'/schedule';const pull=async(k,fixture)=>{const j=await sportsFetch(base+k+path+(fixture?'?fixture=true':''));if(!Array.isArray(j.events))throw Error('shape');return j.events};const allRes=await Promise.allSettled([pull('all',false),pull('all',true)]);events=allRes.filter(r=>r.status==='fulfilled').flatMap(r=>r.value);if(!events.some(e=>{const date=e.date||e.competitions?.[0]?.date;return date&&new Date(date)>new Date()&&!(e.competitions?.[0]?.status?.type?.completed||e.status?.type?.completed)})){const comps=['eng.1','uefa.champions','eng.fa','eng.league_cup','uefa.europa'];const res=await Promise.allSettled(comps.map(k=>pull(k,true)));events.push(...res.filter(r=>r.status==='fulfilled').flatMap(r=>r.value));if(!allRes.some(r=>r.status==='fulfilled')&&!res.some(r=>r.status==='fulfilled'))throw Error('shape');if(res.some(r=>r.status==='rejected'))errors++}if(!events.length&&allRes.every(r=>r.status==='rejected'))throw Error('shape');if(!events.some(e=>new Date(e.date||e.competitions?.[0]?.date)>new Date()))sportStatus=bi('ESPN не вернул будущие матчи Arsenal.','ESPN returned no future Arsenal fixtures.');}else{const j=await sportsFetch(espn+f.league+'/teams/'+encodeURIComponent(f.id)+'/schedule');if(!Array.isArray(j.events))throw Error('shape');events=j.events}let rows=parseTeamEvents({events},f);rows=[...rows.reduce((m,x)=>{const prev=m.get(x.id);if(!prev||x.completed||!prev.completed)m.set(x.id,x);return m},new Map()).values()];if(token!==sportToken)return;life().sports=life().sports.filter(x=>x.source!==source||(!rows.some(r=>r.id===x.id)&&(f.league==='soccer/all'||localDate(new Date(x.stamp))<today()))).concat(rows);
