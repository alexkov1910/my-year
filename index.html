:root{color-scheme:light;--bg:#f4f6f7;--ink:#172b32;--muted:#667780;--line:#e1e7e9;--accent:#176e60;--soft:#e6f3ed;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.45}button,input,select,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #278f80;outline-offset:3px}main{max-width:680px;margin:auto;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(105px + env(safe-area-inset-bottom))}h1,h2,h3,p{margin:0}h1{font-size:38px;letter-spacing:-2px;line-height:1.1}h2{font-size:21px;letter-spacing:-.4px}h3{font-size:17px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);font-weight:750;margin-bottom:8px}.sub{color:var(--muted);font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.year{background:white;border:1px solid var(--line);border-radius:14px;padding:8px 12px;color:var(--ink);font-weight:650}.hero{background:#173d3a;color:#fff;border-radius:24px;padding:22px;display:grid;grid-template-columns:1fr 92px;gap:12px;align-items:center;margin-bottom:20px}.hero .sub{color:#c5dcd5}.hero strong{display:block;font-size:30px;letter-spacing:-1px;margin:6px 0}.ring{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#a7e6be var(--p),#39615b 0)}.ring span{display:grid;place-items:center;width:69px;height:69px;border-radius:50%;background:#173d3a;font-size:18px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:25px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 10px}.stat b{font-size:21px;display:block}.stat span{font-size:11px;color:var(--muted)}.section{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.chips{d %;border:1px solid var(--line);padding:11px;border-radius:11px;background:#f8faf9;color:var(--ink);font-weight:650;font-size:14px}.action.done{background:var(--soft);color:var(--accent);border-color:#cfe6db}.empty{padding:35px 20px;text-align:center;border:1px dashed #cbd6d5;border-radius:20px;color:var(--muted);background:#ffffff80}.empty h3{color:var(--ink);margin-bottom:8px}.empty button{margin-top:15px}.primary{background:var(--accent);border:0;color:white;border-radius:13px;padding:13px 17px;font-weight:700}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:9px}.nav button{background:transparent;border:0;color:var(--muted);font-size:11px;min-width:64px;flex:1;max-width:105px;border-radius:12px;padding:7px 3px}.nav button span{display:block;font-size:22px;line-height:1.2;margin-bottom:3px}.nav button.active{color:var(--accent);background:#eff7f3;font-weight:700}.nav button.add{background:var(--accent);color:#fff}.sheet{position:fixed;inset:0;background:#0d25287a;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet[hidden]{display:none}.panel{background:#fff;border-radius:25px 25px 0 0;width:100%;max-width:680px;max-height:92dvh;overflow:auto;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}.paneltop{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{border:0;background:#eef2f1;border-radius:50%;width:35px;height:35px;color:var(--muted);font-size:20px}label{display:block;font-weight:650;font-size:13px;margin:13px 0 5px}input,select,textarea{width:100%;border:1px solid #d5dfdf;background:#fafcfb;border-radius:11px;padding:11px;color:var(--ink);min-height:44px}textarea{resize:vertical;min-height:70px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{width:100%;margin-top:20px}.danger{background:none;colo </style></head><body><main id="app"></main><nav class="nav" aria-label="Разделы"><button data-tab="home"><span>◉</span>Обзор</button><button data-tab="goals"><span>◎</span>Цели</button><button class="add" id="add"><span>＋</span>Добавить</button><button data-tab="habits"><span>▦</span>Привычки</button><button data-tab="settings"><span>⚙</span>Настройки</button></nav><div class="sheet" id="sheet" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="form-title"><div class="paneltop"><h2 id="form-title">Новая цель</h2><button class="close" id="close" aria-label="Закрыть">×</button></div><form id="form"><label for="name">Название</label><input id="name" required maxlength="160" placeholder="Что хочу сделать?"><label for="area">Направление</label><select id="area"></select><label for="type">Тип</label><select id="type"><option value="result">Результат</option><option value="action">Действие</option><option value="habit">Привычка</option></select><div id="result-fields"><div class="twocol"><div><label for="start">Начальное значение</label><input id="start" type="number" step="any" value="0"></div><div><label for="target">Целевое значение</label><input id="target" type="number" step="any" value="100"></div></div><div class="twocol"><div><label for="current">Текущее значение</label><input id="current" type="number" step="any" value="0"></div><div><label for="unit">Единица</label><input id="unit" maxlength="20" placeholder="€, кг, часов"></div></div></div><div id="habit-fields" hidden><div class="twocol"><div><label for="frequency">Период</label><select id="frequency"><option value="week">В неделю</option><option value="month">В месяц</option><option value="day">Каждый день</option></select></div><div><label for="times">Дней с отметкой</label><input id="times" type="number" min="1" max="7" step="1" value="3"></div></div><p class="sub" style="margin-top:8px">Одна отметка за день. Цель — нужное число дней за период.</p></div><div id="deadline-fields"><label for="deadline">Срок (необязательно)</label><input id="deadline" type="date"></div><label for="notes">Заметка (необязательно)</label><textarea id="notes" maxlength="1000" placeholder="Условия, детали, мотивация"></textarea><button class="primary save" type="submit">Сохранить</button><button class="danger" id="remove" type="button" hidden>Удалить цель</button></form></div></div><div id="toast" class="toast" hidden role="status"></div><input id="importFile" type="file" accept="application/json,.json" hidden><script>
(()=>{'use strict';const AREAS=[['health','Здоровье и физическая форма','✚'],['finance','Финансы','₽'],['work','Работа и собственные проекты','◈'],['learn','Знания и навыки','✦'],['family','Отношения и семья','♡'],['home','Материальные цели и быт','⌂'],['fun','Отдых и впечатления','☀']];const TYPES={result:'Результат',action:'Действие',habit:'Привычка'};const KEY='my-year-v1';const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const parse=d=>new Date(d+'T12:00:00');const addDays=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};const today=()=>localDate(new Date());const num=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n);let state={year:2027,goals:[]};let storageOK=true;try{const raw=localStorage.getItem(KEY);if(raw)state=JSON.parse(raw)}catch(e){storageOK=false}let tab='home',filter='all',areaFilter='all',editing=null;const clampDate=()=>today().slice(0,4)==String(state.year)?today():today()<`${state.year}-01-01`?`${state.year}-01-01`:`${state.year}-12-31`;let selected=clampDate();function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false;toast('Не удалось сохранить данные. Сделайте резервную копию.')}}let timer;function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,3000)}function week(d){const x=parse(d),mon=addDays(x,-((x.getDay()+6)%7));return Array.from({length:7},(_,i)=>localDate(addDays(mon,i)))}function period(g,d){if(g.frequency==='day')return [d,d];if(g.frequency==='month')return [d.slice(0,7)+'-01',localDate(new Date(parse(d).getFullYear(),parse(d).getMonth()+1,0,12))];const w=week(d);return [w[0],w[6]]}function habitCount(g,d){const [a,b]=period(g,d);return (g.logs||[]).filter(x=>x>=a&&x<=b&&x.slice(0,4)==String(g.year)).length}function effectiveTarget(g,d){const [a,b]=period(g,d),first=a<`${g.year}-01-01`?`${g.year}-01-01`:a,last=b>`${g.year}-12-31`?`${g.year}-12-31`:b;const days=Math.round((parse(last)-parse(first))/86400000)+1;return Math.min(g.times,Math.max(1,days))}function progress(g){if(g.type==='action')return g.done?100:0;if(g.type==='habit')return Math.min(100,Math.round(habitCount(g,selected)/effectiveTarget(g,selected)*100));return Math.max(0,Math.min(100,Math.round((g.current-g.start)/(g.target-g.start)*100)))}const all=()=>state.goals.filter(g=>g.year===state.year);const df=d=>parse(d).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});const periodName=g=>g.frequency==='day'?'сегодня / выбранный день':g.frequency==='month'?'в месяц':'в неделю';function card(g){const p=progress(g),done=p>=100,validDate=d=>d.slice(0,4)==String(state.year)&&d<=today();let body='';if(g.type==='result')body=`<div class="numbers"><b>${num(g.current)} / ${num(g.target)} ${esc(g.unit)}</b><button class="small" data-update="${esc(g.id)}">Обновить</button></div><div class="progress"><div style="width:${p}%"></div></div><div class="numbers"><span>Старт: ${num(g.start)}</span><span>${p}%</span></div>`;if(g.type==='action')body=`<button class="action ${g.done?'done':''}" data-done="${esc(g.id)}">${g.done?'✓ Выполнено — отменить':'○ Отметить выполненным'}</button>`;if(g.type==='habit'){const w=week(selected),count=habitCount(g,selected),target=effectiveTarget(g,selected);body=`<div class="numbers"><b>${count} / ${target} ${g.frequency==='day'?'за день':g.frequency==='month'?'за месяц':'за неделю'}</b><span>${done?'✓ Норма выполнена':''}</span></div><div class="progress"><div style="width:${p}%"></div></div><div class="days">${w.map((d,i)=>`<button class="day ${(g.logs||[]).includes(d)?'checked':''}" data-log="${esc(g.id)}" data-date="${d}" ${validDate(d)?'':'disabled'} aria-label="${d}">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i]}<b>${(g.logs||[]).includes(d)?'✓':parse(d).getDate()}</b></button>`).join('')}</div><div class="numbers"><span>${df(w[0])} — ${df(w[6])}</span><span>${g.times} ${periodName(g)}</span></div>`}return `<article class="goal"><div class="goalhead"><div><h3>${esc(g.name)}</h3><div class="meta"><span class="tag ${done?'done':''}">${TYPES[g.type]}</span>${g.deadline?`<span>До ${df(g.deadline)}</span>`:''}${done&&g.type!=='habit'?'<span>✓ Готово</span>':''}</div></div><button class="edit" data-edit="${esc(g.id)}" aria-label="Редактировать">⋯</button></div>${body}${g.notes?`<p class="note">${esc(g.notes)}</p>`:''}</article>`}function empty(t='Пока ничего нет',s='Добавьте первую цель. Вы сами решаете, чего хотите достичь.'){return `<div class="empty"><h3>${t}</h3><p>${s}</p><button class="primary" data-new="1">＋ Добавить</button></div>`}function groups(gs){if(!gs.length)return empty();return AREAS.map(a=>{let list=gs.filter(g=>g.area===a[0]);return list.length?`<div class="group"><i>${a[2]}</i>${a[1]}</div>${list.map(card).join('')}`:''}).join('')}function datebar(){return `<div class="datebar"><button class="small" data-shift="-7" aria-label="Предыдущая неделя">‹</button><input id="selected-date" aria-label="Дата просмотра привычек" type="date" min="${state.year}-01-01" max="${state.year}-12-31" value="${selected}"><button class="small" data-shift="7" aria-label="Следующая неделя">›</button></div>`}function render(){const gs=all(),finite=gs.filter(g=>g.type!=='habit'),habits=gs.filter(g=>g.type==='habit'),completed=finite.filter(g=>progress(g)===100).length,p=finite.length?Math.round(completed/finite.length*100):0;let html=`<header class="top"><div><p class="eyebrow">Личный план</p><h1>${tab==='home'?'Мой год':tab==='goals'?'Цели':tab==='habits'?'Привычки':'Настройки'}</h1></div><select class="year" id="year" aria-label="Год" style="width:auto;min-width:89px">${Array.from(new Set([2026,2027,2028,2029,2030,state.year])).sort((a,b)=>a-b).map(y=>`<option ${y===state.year?'selected':''}>${y}</option>`).join('')}</select></header>`;if(!storageOK)html+='<p class="warning">Хранилище недоступно. Экспортируйте данные, чтобы не потерять их.</p>';if(tab==='home'){html+=`<section class="hero"><div><p class="sub">Годовые цели · ${state.year}</p><strong>${completed} из ${finite.length}</strong><p class="sub">результатов и действий выполнено</p></div><div class="ring" style="--p:${p}%"><span>${p}%</span></div></section><div class="stats"><div class="stat"><b>${gs.filter(g=>g.type==='result').length}</b><span>Результаты</span></div><div class="stat"><b>${gs.filter(g=>g.type==='action').length}</b><span>Действия</span></div><div class="stat"><b>${habits.length}</b><span>Привычки</span></div></div><div class="section"><h2>Направления</h2><span class="sub">7 сфер</span></div>${AREAS.map(a=>{const n=gs.filter(g=>g.area===a[0]);return `<button class="goal" data-area="${a[0]}" style="width:100%;display:flex;align-items:center;text-align:left;gap:12px;color:var(--ink)"><span style="font-size:22px;width:29px;text-align:center;color:var(--accent)">${a[2]}</span><div style="flex:1"><h3>${a[1]}</h3><p class="sub">${n.length} · целей и привычек</p></div><span class="sub">›</span></button>`}).join('')}<div class="section"><h2>Привычки</h2><button class="small" data-goto="habits">Все</button></div>${habits.length?datebar()+habits.slice(0,3).map(card).join(''):empty('Нет привычек','Добавьте регулярное действие, которое хотите отслеживать.')}`;}if(tab==='goals'){html+=`<div class="chips">${[['all','Все'],['result','Результаты'],['action','Действия'],['habit','Привычки']].map(([k,n])=>`<button class="chip ${filter===k?'on':''}" data-filter="${k}">${n}</button>`).join('')}</div><select id="area-filter" aria-label="Фильтр по направлению"><option value="all">Все направления</option>${AREAS.map(a=>`<option value="${a[0]}" ${areaFilter===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select>${filter==='habit'||(filter==='all'&&habits.length)?datebar():''}${groups(gs.filter(g=>(filter==='all'||filter===g.type)&&(areaFilter==='all'||areaFilter===g.area)))}`;}if(tab==='habits'){html+=`<p class="sub">Отмечайте дни, когда выполнили привычку. Переключайте недели для просмотра истории.</p>${datebar()}<div class="stats"><div class="stat"><b>${habits.length}</b><span>Привычек</span></div><div class="stat"><b>${habits.filter(g=>progress(g)>=100).length}</b><span>Норма за период</span></div><div class="stat"><b>${habits.filter(g=>(g.logs||[]).includes(selected)).length}</b><span>За выбранный день</span></div></div>${groups(habits)}`;}if(tab==='settings'){html+=`<div class="settings"><h2>Данные</h2><p class="sub">Цели хранятся на этом устройстве, без аккаунта и сервера. Экспорт включает все годы. Импорт заменяет текущие данные после подтверждения.</p><button class="primary" id="export">Скачать резервную копию</button><button class="action" id="import">Восстановить из файла</button></div><div class="settings"><h2>Установка на iPhone</h2><p class="sub">Откройте размещённое приложение в Safari, нажмите «Поделиться» и выберите «На экран Домой». После первого открытия по HTTPS приложение может работать без интернета.</p><p class="sub">Если вы меняете телефон или очищаете данные Safari, сначала сделайте резервную копию. Автоматической синхронизации нет.</p></div><div class="settings"><h2>Принцип</h2><p class="sub">Свобода — критерий выбора целей, а не обязательный раздел. Заполняйте только те направления, которые вам действительно важны.</p></div>`;}$('app').innerHTML=html;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));}
function changeTab(t){tab=t;filter='all';areaFilter='all';render();window.scrollTo(0,0)}function fields(){const t=$('type').value;$('result-fields').hidden=t!=='result';$('habit-fields').hidden=t!=='habit';$('deadline-fields').hidden=t==='habit';let f=$('frequency').value;$('times').max=f==='month'?31:f==='day'?1:7;if(f==='day')$('times').value=1;$('times').disabled=f==='day';if(Number($('times').value)>Number($('times').max))$('times').value=$('times').max;}function openForm(id){const g=state.goals.find(x=>x.id===id);editing=g?.id??null;$('form-title').textContent=g?'Редактировать цель':'Новая цель';$('name').value=g?.name??'';$('area').value=g?.area??(areaFilter!=='all'?areaFilter:AREAS[0][0]);$('type').value=g?.type??(tab==='habits'?'habit':filter!=='all'?filter:'result');$('start').value=g?.start??0;$('target').value=g?.target??100;$('current').value=g?.current??0;$('unit').value=g?.unit??'';$('frequency').value=g?.frequency??'week';$('times').value=g?.times??3;$('deadline').min=`${state.year}-01-01`;$('deadline').max=`${state.year}-12-31`;$('deadline').value=g?.deadline??'';$('notes').value=g?.notes??'';$('remove').hidden=!g;fields();$('sheet').hidden=false;document.body.style.overflow='hidden';}function closeForm(){$('sheet').hidden=true;document.body.style.overflow='';editing=null}function find(id){return state.goals.find(g=>g.id===id)}function shift(n){let d=localDate(addDays(parse(selected),n));selected=d<`${state.year}-01-01`?`${state.year}-01-01`:d>`${state.year}-12-31`?`${state.year}-12-31`:d;render()}
$('area').innerHTML=AREAS.map(a=>`<option value="${a[0]}">${a[1]}</option>`).join('');$('type').onchange=fields;$('frequency').onchange=fields;$('add').onclick=()=>openForm();$('close').onclick=closeForm;$('sheet').onclick=e=>{if(e.target===$('sheet'))closeForm()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeForm()});$('form').onsubmit=e=>{e.preventDefault();const old=find(editing),type=$('type').value;let g={id:old?.id??(globalThis.crypto?.randomUUID?.()??Date.now().toString(36)+Math.random().toString(36).slice(2)),year:state.year,name:$('name').value.trim(),area:$('area').value,type,notes:$('notes').value.trim()};if(!g.name){alert('Введите название.');return}if(type==='result'){if(['start','target','current'].some(id=>$(id).value==='')){alert('Заполните числовые показатели.');return}g.start=Number($('start').value);g.target=Number($('target').value);g.current=Number($('current').value);g.unit=$('unit').value.trim();if(![g.start,g.target,g.current].every(Number.isFinite)||g.start===g.target){alert('Начальное и целевое значения должны быть различны.');return}}if(type==='action')g.done=old?.type==='action'&&!!old.done;if(type==='habit'){g.frequency=$('frequency').value;g.times=g.frequency==='day'?1:Number($('times').value);if(!Number.isInteger(g.times)||g.times<1||g.times>Number($('times').max)){alert('Проверьте периодичность.');return}g.logs=old?.type==='habit'?old.logs||[]:[]}else{g.deadline=$('deadline').value}if(old){state.goals=state.goals.map(x=>x.id===old.id?g:x)}else state.goals.push(g);persist();closeForm();render();toast('Цель сохранена')};$('remove').onclick=()=>{if(confirm('Удалить цель и всю её историю?')){state.goals=state.goals.filter(g=>g.id!==editing);persist();closeForm();render();toast('Цель удалена')}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>changeTab(b.dataset.tab));$('app').addEventListener('change',e=>{if(e.target.id==='year'){state.year=Number(e.target.value);selected=clampDate()
